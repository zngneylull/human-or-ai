name: Sync Fork with Upstream

on:
  schedule:
    - cron: "0 0 * * *"   # Her gün gece 00:00'da çalışır
  workflow_dispatch:       # Manuel olarak da çalıştırabilirsin

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/ARKADASIN-KULLANICI-ADI/REPO-ADI.git
          git fetch upstream

      - name: Merge upstream into main
        run: |
          git checkout main
          git merge upstream/main --ff-only || true

      - name: Push changes
        run: |
          git push origin main || true
